{% extends "base.html" %}

{% block title %}听课登记 - 西南大学教学信息中心{% endblock %}

{% block content %}
<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-calendar-check"></i> 听课登记
                    </h5>
                </div>
                <div class="card-body">
                    
                    <!-- 1. 课程选择 (搜索优化) -->
                    <div class="mb-4">
                        <label for="courseSelect" class="form-label fw-bold">选择课程</label>
                        <select id="courseSelect" class="form-select" style="width: 100%;">
                            <option value="">请输入课程名称、教师或课程号进行搜索...</option>
                        </select>
                        <div class="form-text text-muted">
                            <i class="bi bi-info-circle"></i> 支持模糊搜索，输入关键词后自动加载课程列表。
                        </div>
                    </div>

                    <!-- 2. 登记表单与历史记录 (选中课程后显示) -->
                    <div id="courseDetailSection" style="display: none;">
                        
                        <div class="row">
                            <!-- 左侧：登记操作 -->
                            <div class="col-md-7">
                                <div class="card mb-3 border-primary">
                                    <div class="card-header bg-light text-primary fw-bold">
                                        <i class="bi bi-pencil-square"></i> 新增登记
                                    </div>
                                    <div class="card-body">
                                        <!-- 课程详情展示 -->
                                        <div class="alert alert-secondary mb-3">
                                            <div class="row g-2">
                                                <div class="col-sm-6"><strong>课程：</strong> <span id="dispCourseName"></span></div>
                                                <div class="col-sm-6"><strong>教师：</strong> <span id="dispTeacher"></span></div>
                                                <div class="col-sm-6"><strong>时间：</strong> <span id="dispTime"></span></div>
                                                <div class="col-sm-6"><strong>地点：</strong> <span id="dispLocation"></span></div>
                                                <div class="col-12 text-muted small mt-1">
                                                    <span id="dispCode"></span>
                                                </div>
                                            </div>
                                        </div>

                                        <form id="reservationForm">
                                            <input type="hidden" id="courseCode" name="course_code">
                                            <input type="hidden" id="selectionCode" name="selection_code">
                                            
                                            <div class="mb-3">
                                                <label class="form-label">听课计划说明 <span class="text-danger">*</span></label>
                                                <div class="input-group">
                                                    <textarea class="form-control" id="listeningInfo" name="listening_info" rows="3" 
                                                              placeholder="请填写您要在什么地点听哪一节课&#10;例如：第5周星期三第3-4节，在教学楼A101教室听课"></textarea>
                                                    <button class="btn btn-outline-info" type="button" onclick="getTimeSuggestion()">
                                                        <i class="bi bi-lightbulb"></i> 建议
                                                    </button>
                                                </div>
                                                <div id="timeSuggestion" class="mt-2 p-2 bg-light border rounded" style="display: none;">
                                                    <div class="d-flex justify-content-between align-items-center">
                                                        <span><strong>建议：</strong><span id="suggestionText"></span></span>
                                                        <button type="button" class="btn btn-sm btn-primary ms-2" onclick="useSuggestion()">使用</button>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="d-grid">
                                                <button type="button" class="btn btn-primary" onclick="submitReservation()">
                                                    <i class="bi bi-check-lg"></i> 确认登记
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- 右侧：登记历史 -->
                            <div class="col-md-5">
                                <div class="card mb-3">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <span class="fw-bold"><i class="bi bi-clock-history"></i> 该课程登记历史</span>
                                        <button class="btn btn-sm btn-link text-decoration-none" onclick="loadHistory(true)">查看全部</button>
                                    </div>
                                    <div class="card-body p-0">
                                        <div class="list-group list-group-flush" id="historyList">
                                            <!-- 历史记录动态加载 -->
                                            <div class="text-center py-3 text-muted">请先选择课程</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 初始提示 -->
                    <div id="initialTip" class="text-center py-5 text-muted">
                        <i class="bi bi-search display-1"></i>
                        <p class="mt-3 fs-5">请在上方搜索框中输入课程信息进行查找</p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- 查看全部历史模态框 -->
<div class="modal fade" id="allHistoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">全部登记历史</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>登记时间</th>
                                <th>计划说明</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="allHistoryTableBody">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<!-- Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document.ready).ready(function() {
    // 初始化 Select2
    $('#courseSelect').select2({
        theme: 'bootstrap-5',
        language: {
            inputTooShort: function () { return "请输入至少 1 个字符进行搜索"; },
            searching: function () { return "搜索中..."; },
            noResults: function () { return "未找到匹配的课程"; }
        },
        ajax: {
            url: '/user/api/available_courses',
            dataType: 'json',
            delay: 250,
            data: function (params) {
                return {
                    q: params.term,
                    page: params.page || 1
                };
            },
            processResults: function (data, params) {
                params.page = params.page || 1;
                return {
                    results: data.results,
                    pagination: {
                        more: data.pagination.more
                    }
                };
            },
            cache: true
        },
        placeholder: '请输入课程名称、教师或课程号',
        minimumInputLength: 1,
    });

    // 监听选择事件
    $('#courseSelect').on('select2:select', function (e) {
        var data = e.params.data;
        displayCourseDetails(data);
    });

    // 监听清除事件
    $('#courseSelect').on('select2:unselect', function (e) {
        $('#courseDetailSection').hide();
        $('#initialTip').show();
    });
});

// 显示课程详情并加载历史
function displayCourseDetails(course) {
    // 填充隐藏域
    $('#courseCode').val(course.course_code);
    $('#selectionCode').val(course.selection_code);
    
    // 填充显示信息
    $('#dispCourseName').text(course.course_name);
    $('#dispTeacher').text(course.teacher_name + ' (' + course.teacher_college + ')');
    $('#dispTime').text(course.class_time || '未知');
    $('#dispLocation').text(course.class_location || '未知');
    $('#dispCode').text('课程号: ' + course.course_code + ' | 选课号: ' + course.selection_code);
    
    // 显示区域
    $('#initialTip').hide();
    $('#courseDetailSection').fadeIn();
    
    // 加载历史 (最新5条)
    loadHistory(false);
}

// 加载历史记录
function loadHistory(isAll) {
    const courseCode = $('#courseCode').val();
    const selectionCode = $('#selectionCode').val();
    const limit = isAll ? 100 : 5;
    
    $.get('/user/api/course_registration_history', {
        course_code: courseCode,
        selection_code: selectionCode,
        limit: limit
    }, function(res) {
        if (res.success) {
            if (isAll) {
                renderAllHistory(res.data);
            } else {
                renderRecentHistory(res.data);
            }
        } else {
            alert('加载历史记录失败: ' + res.message);
        }
    });
}

function renderRecentHistory(data) {
    const container = $('#historyList');
    container.empty();
    
    if (data.length === 0) {
        container.html('<div class="text-center py-3 text-muted">暂无登记记录</div>');
        return;
    }
    
    data.forEach(item => {
        const statusBadge = item.is_used ? 
            '<span class="badge bg-success float-end">已填表</span>' : 
            '<span class="badge bg-secondary float-end">未填表</span>';
            
        const html = `
            <div class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <small class="text-muted">${item.created_at}</small>
                    ${statusBadge}
                </div>
                <p class="mb-1 text-truncate" title="${item.listening_info}">${item.listening_info || '无备注'}</p>
            </div>
        `;
        container.append(html);
    });
}

function renderAllHistory(data) {
    const tbody = $('#allHistoryTableBody');
    tbody.empty();
    
    if (data.length === 0) {
        tbody.html('<tr><td colspan="3" class="text-center">暂无记录</td></tr>');
    } else {
        data.forEach(item => {
            const statusText = item.is_used ? 
                '<span class="text-success"><i class="bi bi-check-circle"></i> 已填表</span>' : 
                '<span class="text-secondary">未填表</span>';
                
            const html = `
                <tr>
                    <td>${item.created_at}</td>
                    <td>${item.listening_info || '-'}</td>
                    <td>${statusText}</td>
                </tr>
            `;
            tbody.append(html);
        });
    }
    
    const modal = new bootstrap.Modal(document.getElementById('allHistoryModal'));
    modal.show();
}

// 提交登记
function submitReservation() {
    const data = {
        course_code: $('#courseCode').val(),
        selection_code: $('#selectionCode').val(),
        listening_info: $('#listeningInfo').val()
    };
    
    if (!data.listening_info.trim()) {
        alert('请填写听课计划说明');
        return;
    }
    
    $.ajax({
        url: '/user/api/create_reservation',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(res) {
            if (res.success) {
                alert('登记成功！');
                $('#listeningInfo').val(''); // 清空输入
                loadHistory(false); // 刷新历史
            } else {
                alert('登记失败: ' + res.message);
            }
        },
        error: function(xhr, status, error) {
            let errorMsg = '系统错误，请重试';
            if (xhr.responseJSON && xhr.responseJSON.message) {
                errorMsg = xhr.responseJSON.message;
            }
            alert('登记失败：' + errorMsg);
            console.error(error);
        }
    });
}

// 获取时间建议
function getTimeSuggestion() {
    $.get('/user/api/time_suggestion', function(res) {
        if (res.success) {
            $('#suggestionText').text(res.suggestion);
            $('#timeSuggestion').slideDown();
        } else {
            alert('获取建议失败');
        }
    });
}

function useSuggestion() {
    $('#listeningInfo').val($('#suggestionText').text());
    $('#timeSuggestion').slideUp();
}
</script>
{% endblock %}
