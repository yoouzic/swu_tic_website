{% extends "base.html" %}

{% block title %}修改密码 - 西南大学教学信息中心{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark text-center">
                <h4 class="mb-0">
                    <i class="bi bi-shield-lock"></i> 修改密码
                </h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info" role="alert">
                    <i class="bi bi-info-circle"></i>
                    为了您的账户安全，请定期更换密码。新密码应包含字母、数字，长度至少6位。
                </div>
                
                <form method="POST" id="changePasswordForm">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">
                            <i class="bi bi-lock"></i> 当前密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="current_password" 
                                   name="current_password" placeholder="请输入当前密码" required>
                            <button class="btn btn-outline-secondary" type="button" 
                                    onclick="togglePassword('current_password', 'currentToggleIcon')">
                                <i class="bi bi-eye" id="currentToggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="new_password" class="form-label">
                            <i class="bi bi-key"></i> 新密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="new_password" 
                                   name="new_password" placeholder="请输入新密码" required>
                            <button class="btn btn-outline-secondary" type="button" 
                                    onclick="togglePassword('new_password', 'newToggleIcon')">
                                <i class="bi bi-eye" id="newToggleIcon"></i>
                            </button>
                        </div>
                        <div class="form-text">
                            密码长度至少6位，建议包含字母和数字
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-check-circle"></i> 确认新密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm_password" 
                                   name="confirm_password" placeholder="请再次输入新密码" required>
                            <button class="btn btn-outline-secondary" type="button" 
                                    onclick="togglePassword('confirm_password', 'confirmToggleIcon')">
                                <i class="bi bi-eye" id="confirmToggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 密码强度指示器 -->
                    <div class="mb-3">
                        <label class="form-label">密码强度：</label>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar" id="passwordStrength" role="progressbar" 
                                 style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <small class="form-text" id="strengthText">请输入密码</small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg"></i> 修改密码
                        </button>
                        <a href="{{ url_for('user.profile') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回个人资料
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 密码显示/隐藏切换
function togglePassword(fieldId, iconId) {
    const passwordField = document.getElementById(fieldId);
    const toggleIcon = document.getElementById(iconId);
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleIcon.className = 'bi bi-eye-slash';
    } else {
        passwordField.type = 'password';
        toggleIcon.className = 'bi bi-eye';
    }
}

// 密码强度检测
function checkPasswordStrength(password) {
    let strength = 0;
    let strengthText = '';
    let strengthClass = '';
    
    if (password.length >= 6) strength += 25;
    if (password.length >= 8) strength += 25;
    if (/[a-z]/.test(password)) strength += 15;
    if (/[A-Z]/.test(password)) strength += 15;
    if (/[0-9]/.test(password)) strength += 10;
    if (/[^A-Za-z0-9]/.test(password)) strength += 10;
    
    if (strength < 30) {
        strengthText = '弱';
        strengthClass = 'bg-danger';
    } else if (strength < 60) {
        strengthText = '中等';
        strengthClass = 'bg-warning';
    } else if (strength < 90) {
        strengthText = '强';
        strengthClass = 'bg-info';
    } else {
        strengthText = '很强';
        strengthClass = 'bg-success';
    }
    
    return { strength, strengthText, strengthClass };
}

// 实时密码强度检测
document.getElementById('new_password').addEventListener('input', function() {
    const password = this.value;
    const result = checkPasswordStrength(password);
    const progressBar = document.getElementById('passwordStrength');
    const strengthText = document.getElementById('strengthText');
    
    progressBar.style.width = result.strength + '%';
    progressBar.className = 'progress-bar ' + result.strengthClass;
    strengthText.textContent = password ? '密码强度: ' + result.strengthText : '请输入密码';
});

// 表单验证
document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    const currentPassword = document.getElementById('current_password').value;
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // 检查密码长度
    if (newPassword.length < 6) {
        e.preventDefault();
        alert('新密码长度至少6位');
        return;
    }
    
    // 检查密码确认
    if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert('两次输入的新密码不一致');
        return;
    }
    
    // 检查新密码是否与当前密码相同
    if (currentPassword === newPassword) {
        e.preventDefault();
        alert('新密码不能与当前密码相同');
        return;
    }
});

// 密码确认实时验证
document.getElementById('confirm_password').addEventListener('input', function() {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = this.value;
    
    if (confirmPassword && newPassword !== confirmPassword) {
        this.setCustomValidity('密码不匹配');
        this.classList.add('is-invalid');
    } else {
        this.setCustomValidity('');
        this.classList.remove('is-invalid');
        if (confirmPassword) {
            this.classList.add('is-valid');
        }
    }
});
</script>
{% endblock %}
