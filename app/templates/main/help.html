{% extends "base.html" %}

{% block title %}使用帮助 - 西南大学教学信息中心{% endblock %}

{% block content %}
<div class="auth-layout">
    <section class="auth-intro">
        <span class="auth-kicker">西南大学教学信息中心</span>
        <h1>使用帮助</h1>
    </section>
    <section class="auth-panel" aria-labelledby="help-panel-title">
        <i class="bi bi-question-circle auth-panel__icon" aria-hidden="true"></i>
        <h2 id="help-panel-title">使用帮助</h2>
        <p>登录与账号问题：</p>
        <ul>
            <li>使用系统分配的账号或学号登录。</li>
            <li>首次登录使用系统分配的初始密码。</li>
            <li>信息员可从“填写听课表”提交反馈，从工作台的“查看记录”查看已交表单。</li>
            <li>账号或权限有疑问时，请联系系统管理员。</li>
        </ul>
        <a class="btn btn-primary" href="{{ url_for('auth.login') }}">返回登录</a>
    </section>
</div>
{% endblock %}
