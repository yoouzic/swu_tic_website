{% extends "base.html" %}

{% block title %}西大听课工作台{% endblock %}

{% block content %}
<div class="auth-layout">
    <section class="auth-intro">
        <span class="auth-kicker">西南大学教学信息中心</span>
        <h1>西大听课工作台</h1>
    </section>
    <section class="auth-panel" aria-labelledby="public-panel-title">
        <i class="bi bi-journal-check auth-panel__icon" aria-hidden="true"></i>
        <h2 id="public-panel-title">进入工作台</h2>
        <p>使用系统分配的账号登录。</p>
        <a class="btn btn-primary" href="{{ url_for('auth.login') }}">登录工作台</a>
        <p class="auth-panel__help">首次登录请使用系统分配的初始密码。如有问题请联系管理员。</p>
    </section>
</div>
{% endblock %}
