{% extends "base.html" %}

{% block title %}自动化证据 - 专业审查{% endblock %}

{% block content %}
<div class="container-fluid automation-results-page">
    <div id="reviewQueueFeedback" class="activity-feedback" role="status" aria-live="polite"></div>
    <section class="activity-panel" aria-labelledby="automationResultsTitle">
        <div class="activity-panel__header activity-panel__header--split">
            <div>
                <h1 id="automationResultsTitle"><i class="fas fa-clipboard-check" aria-hidden="true"></i> 自动化分类与证据</h1>
                <p>系统仅提供分类和证据，最终通过或驳回由人工审核人执行。</p>
            </div>
            <div>
                <span id="taskStatus" class="badge bg-secondary me-2">加载中...</span>
                <button class="btn btn-primary btn-sm" id="refreshResults" type="button">刷新证据</button>
            </div>
        </div>
        <div class="activity-panel__body">
            <div id="batchSummary" class="automation-results-summary mb-3" aria-live="polite" hidden></div>
            <div id="resultsSummary" class="automation-results-summary" aria-live="polite"></div>
            <div id="resultsContent">
                <div class="activity-empty">正在加载自动化批次……</div>
            </div>
        </div>
    </section>
</div>

<div class="offcanvas offcanvas-end app-evidence-drawer" tabindex="-1" id="automationResultsEvidenceDrawer" aria-labelledby="automationResultsEvidenceTitle">
    <div class="offcanvas-header">
        <h2 class="offcanvas-title fs-5" id="automationResultsEvidenceTitle">自动化证据</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
    </div>
    <div class="offcanvas-body" id="automationResultsEvidenceBody" aria-live="polite">
        <section class="evidence-section-schedule" data-evidence-source="schedule"><h3>schedule</h3><p data-evidence-value>—</p></section>
        <section class="evidence-section-rule" data-evidence-source="rule"><h3>rule</h3><p data-evidence-value>—</p></section>
        <section class="evidence-section-text" data-evidence-source="text"><h3>text</h3><p data-evidence-value>—</p></section>
        <section class="evidence-section-history" data-evidence-source="history"><h3>history</h3><p data-evidence-value>—</p></section>
        <section class="evidence-section-llm" data-evidence-source="llm"><h3>llm</h3><p data-evidence-value>—</p></section>
        <section class="evidence-section-system" data-evidence-source="system"><h3>system</h3><p data-evidence-value>—</p></section>
        <label class="form-label mt-3" for="automationResultsSuggestedComment">建议评论（草稿）</label>
        <textarea id="automationResultsSuggestedComment" class="form-control" data-suggested-comment-draft rows="4"></textarea>
        <a class="btn btn-outline-primary mt-2" data-human-review-action href="#">打开人工审核</a>
    </div>
</div>

<script>
(() => {
    const feedback = document.getElementById('reviewQueueFeedback');
    const resultsContent = document.getElementById('resultsContent');
    const statusNode = document.getElementById('taskStatus');
    const batchSummaryNode = document.getElementById('batchSummary');
    const summaryNode = document.getElementById('resultsSummary');
    const categoryLabels = {
        '无明显风险': '无明显风险',
        '建议复核': '建议复核',
        '高风险疑似假表': '高风险疑似假表',
        '系统无法判断': '系统无法判断',
    };
    const modeLabels = {rules_only: 'rules_only', llm_only: 'llm_only', combined: 'combined'};
    const sourceNames = ['schedule', 'rule', 'text', 'history', 'llm', 'system'];

    const setFeedback = (message, level = 'info') => {
        if (!feedback) return;
        feedback.textContent = String(message || '');
        feedback.className = `activity-feedback activity-feedback--${level}`;
    };

    const setStatus = (status) => {
        const labels = {completed: '已完成', completed_with_errors: '完成但有失败', running: '运行中', queued: '排队中', failed: '失败', cancelled: '已取消'};
        statusNode.textContent = labels[status] || '未运行';
        statusNode.className = `badge ${status === 'completed' ? 'bg-success' : status === 'failed' ? 'bg-danger' : 'bg-secondary'}`;
    };

    const statusLabel = (status) => ({
        completed: '已完成',
        completed_with_errors: '完成但有失败',
        running: '运行中',
        queued: '排队中',
        failed: '失败',
        cancelled: '已取消',
    }[status] || '未运行');

    const appendCell = (row, value) => {
        const cell = document.createElement('td');
        cell.textContent = String(value ?? '—');
        row.appendChild(cell);
        return cell;
    };

    const clearEvidence = () => {
        sourceNames.forEach((source) => {
            const node = document.querySelector(`#automationResultsEvidenceDrawer [data-evidence-source="${source}"] [data-evidence-value]`);
            if (node) node.textContent = '暂无证据';
        });
        const comment = document.getElementById('automationResultsSuggestedComment');
        if (comment) comment.value = '';
    };

    function automationEvidenceSource(finding, assessment) {
        const source = String(finding.source || 'system');
        if (source !== 'rule') {
            return ['schedule', 'rule', 'text', 'history', 'llm', 'system'].includes(source) ? source : 'system';
        }
        const ruleVersion = assessment.rule_version || {};
        const revision = ruleVersion[finding.rule_key];
        const handler = revision && revision.handler;
        if (['required_prefix', 'regex_pattern', 'min_length'].includes(handler)) return 'text';
        return 'rule';
    }

    const renderEvidence = (assessment, formId) => {
        clearEvidence();
        const grouped = {schedule: [], rule: [], text: [], history: [], llm: [], system: []};
        (assessment.findings || []).forEach((finding) => {
            grouped[automationEvidenceSource(finding, assessment)].push(`${finding.title || ''}${finding.message ? `：${finding.message}` : ''}`);
        });
        sourceNames.forEach((source) => {
            const node = document.querySelector(`#automationResultsEvidenceDrawer [data-evidence-source="${source}"] [data-evidence-value]`);
            if (node && grouped[source].length) node.textContent = grouped[source].join('；');
        });
        const comment = document.getElementById('automationResultsSuggestedComment');
        if (comment) comment.value = String(assessment.suggested_comment || '');
        const humanAction = document.querySelector('#automationResultsEvidenceDrawer [data-human-review-action]');
        if (humanAction) {
            humanAction.href = `/admin/review/form/${encodeURIComponent(formId)}`;
            humanAction.textContent = '打开人工审核';
        }
        bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('automationResultsEvidenceDrawer')).show();
    };

    const openEvidence = (formId, assessmentId) => {
        if (!assessmentId) {
            clearEvidence();
            setFeedback('该表单尚无自动化评估。', 'info');
            return;
        }
        fetch(`/admin/api/automation/assessments/${encodeURIComponent(assessmentId)}`)
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || '证据加载失败。');
                return data.assessment;
            })
            .then(assessment => renderEvidence(assessment, formId))
            .catch(error => setFeedback(error.message || '证据加载失败。', 'error'));
    };

    const renderResults = (payload) => {
        const batch = payload.batch || {};
        setStatus(payload.status || batch.status);
        summaryNode.replaceChildren();
        const summary = document.createElement('span');
        const mode = modeLabels[batch.review_mode] || 'unknown';
        summary.textContent = `审核模式 ${mode}；处理 ${Number(batch.processed_count || 0)}/${Number(batch.target_form_count || 0)}；失败 ${Number(batch.failed_count || 0)}；无明显风险 ${Number(batch.clear_count || 0)}；建议复核 ${Number(batch.review_count || 0)}；高风险 ${Number(batch.high_risk_count || 0)}；无法判断 ${Number(batch.unknown_count || 0)}。`;
        summaryNode.appendChild(summary);
        resultsContent.replaceChildren();
        const results = Array.isArray(batch.results) ? batch.results : [];
        if (!results.length) {
            const empty = document.createElement('div');
            empty.className = 'activity-empty';
            empty.textContent = '暂无自动化评估结果。';
            resultsContent.appendChild(empty);
            return;
        }
        const table = document.createElement('table');
        table.className = 'table table-hover align-middle';
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        ['表单', '分类', '缓存', '错误', '操作'].forEach(label => {
            const cell = document.createElement('th');
            cell.textContent = label;
            headRow.appendChild(cell);
        });
        head.appendChild(headRow);
        table.appendChild(head);
        const body = document.createElement('tbody');
        results.forEach(result => {
            const row = document.createElement('tr');
            appendCell(row, result.form_id);
            appendCell(row, categoryLabels[result.category] || categoryLabels['系统无法判断']);
            appendCell(row, result.cache_hit ? '已复用' : '新评估');
            appendCell(row, result.error_code || '—');
            const actions = document.createElement('td');
            const evidence = document.createElement('button');
            evidence.type = 'button';
            evidence.className = 'btn btn-sm btn-outline-info me-1';
            evidence.textContent = '查看证据';
            evidence.addEventListener('click', () => openEvidence(result.form_id, result.assessment_id));
            const human = document.createElement('a');
            human.className = 'btn btn-sm btn-outline-primary';
            human.href = `/admin/review/form/${encodeURIComponent(result.form_id)}`;
            human.textContent = '人工审核';
            human.dataset.humanReviewAction = 'true';
            actions.append(evidence, human);
            row.appendChild(actions);
            body.appendChild(row);
        });
        table.appendChild(body);
        resultsContent.appendChild(table);
    };

    const renderBatchSummary = (payloads) => {
        if (!batchSummaryNode) return;
        batchSummaryNode.replaceChildren();
        batchSummaryNode.hidden = payloads.length < 2;
        if (payloads.length < 2) return;

        const heading = document.createElement('h2');
        heading.className = 'h5 mb-3';
        heading.textContent = '批次汇总';
        const table = document.createElement('table');
        table.className = 'table table-sm table-bordered mb-0';
        const head = document.createElement('thead');
        const headRow = document.createElement('tr');
        ['审核模式', '批次', '处理/目标', '失败', '状态'].forEach(label => {
            const cell = document.createElement('th');
            cell.textContent = label;
            headRow.appendChild(cell);
        });
        head.appendChild(headRow);
        table.appendChild(head);
        const body = document.createElement('tbody');
        payloads.forEach(payload => {
            const batch = payload.batch || {};
            const row = document.createElement('tr');
            appendCell(row, modeLabels[batch.review_mode] || 'unknown');
            appendCell(row, batch.batch_id || batch.id || '—');
            appendCell(row, `${Number(batch.processed_count || 0)}/${Number(batch.target_form_count || 0)}`);
            appendCell(row, Number(batch.failed_count || 0));
            appendCell(row, statusLabel(payload.status || batch.status));
            body.appendChild(row);
        });
        table.appendChild(body);
        batchSummaryNode.append(heading, table);
    };

    const query = new URLSearchParams(window.location.search);
    const batchId = query.get('batch_id');
    const endpoint = batchId ? `/admin/api/review/auto_check/status?batch_id=${encodeURIComponent(batchId)}` : '/admin/api/review/auto_check/status';
    const batchIds = (query.get('batch_ids') || '').split(',').map(value => value.trim()).filter(Boolean);
    const requestedBatchIds = batchIds.length > 1 ? batchIds : (batchId ? [batchId] : []);
    const endpoints = requestedBatchIds.length
        ? requestedBatchIds.map(id => `/admin/api/review/auto_check/status?batch_id=${encodeURIComponent(id)}`)
        : [endpoint];

    const loadResults = () => {
        Promise.all(endpoints.map(endpoint => fetch(endpoint).then(async response => {
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || '批次读取失败。');
            return data;
        })))
            .then(payloads => {
                renderBatchSummary(payloads);
                renderResults(payloads[0]);
            })
            .catch(error => setFeedback(error.message || '批次读取失败。', 'error'));
    };

    document.getElementById('refreshResults')?.addEventListener('click', loadResults);
    document.addEventListener('DOMContentLoaded', loadResults);
})();
</script>
{% endblock %}
