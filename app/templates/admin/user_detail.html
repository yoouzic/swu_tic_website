{% extends "base.html" %}

{% block title %}查看个人信息{% endblock %}

{% block content %}
{% include 'admin/_user_detail_panel.html' %}
{% endblock %}

{% block extra_css %}
<style>
.assessment-table {
    font-size: 0.9rem;
}

.assessment-reason {
    max-width: 260px;
    white-space: normal;
    word-break: break-word;
}
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
function toggleVersions(uniqueId) {
    const row = document.getElementById(`versions-${uniqueId}`);
    const chevron = document.getElementById(`chevron-${uniqueId}`);
    if (!row) return;
    const isHidden = row.style.display === 'none' || row.style.display === '';
    row.style.display = isHidden ? 'table-row' : 'none';
    if (chevron) {
        chevron.className = isHidden ? 'fas fa-chevron-up me-1' : 'fas fa-chevron-down me-1';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const body = document.getElementById('assessmentItemsBody');
    if (!body) {
        return;
    }

    const toggleButton = document.getElementById('toggleAssessmentItems');
    const sortButtons = Array.from(document.querySelectorAll('.assessment-sort-btn'));

    function applyVisibleLimit() {
        const expanded = body.dataset.expanded === 'true';
        Array.from(body.querySelectorAll('.assessment-item-row')).forEach((row, index) => {
            row.classList.toggle('d-none', !expanded && index >= 5);
        });
        if (toggleButton) {
            toggleButton.textContent = expanded ? '收起考评项' : '查看所有考评项';
        }
    }

    function sortRows(sortType) {
        const rows = Array.from(body.querySelectorAll('.assessment-item-row'));
        rows.sort((a, b) => {
            if (sortType === 'time') {
                return Number(b.dataset.time || 0) - Number(a.dataset.time || 0);
            }
            const scoreDiff = Number(b.dataset.score || 0) - Number(a.dataset.score || 0);
            if (scoreDiff !== 0) {
                return scoreDiff;
            }
            const departmentScoreDiff = Number(b.dataset.departmentScore || 0) - Number(a.dataset.departmentScore || 0);
            if (departmentScoreDiff !== 0) {
                return departmentScoreDiff;
            }
            return Number(b.dataset.time || 0) - Number(a.dataset.time || 0);
        });
        rows.forEach(row => body.appendChild(row));
        body.dataset.expanded = 'false';
        applyVisibleLimit();
    }

    sortButtons.forEach(button => {
        button.addEventListener('click', function() {
            sortButtons.forEach(item => {
                item.classList.remove('active', 'btn-warning');
                item.classList.add('btn-outline-warning');
            });
            this.classList.add('active', 'btn-warning');
            this.classList.remove('btn-outline-warning');
            sortRows(this.dataset.sort || 'score');
        });
    });

    if (toggleButton) {
        toggleButton.addEventListener('click', function() {
            body.dataset.expanded = body.dataset.expanded === 'true' ? 'false' : 'true';
            applyVisibleLimit();
        });
    }

    applyVisibleLimit();
});
</script>
{% endblock %}
