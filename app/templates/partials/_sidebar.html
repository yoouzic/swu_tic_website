<aside class="app-sidebar" id="appSidebar" aria-label="主导航">
    <a class="app-brand" href="{{ url_for('main.index') }}">
        <span class="app-brand__mark" aria-hidden="true"><i class="bi bi-journal-bookmark"></i></span>
        <span><span class="app-brand__name">西大听课工作台</span><span class="app-brand__meta">教学信息中心</span></span>
    </a>
    <nav class="app-nav">
        {% for group in app_navigation %}
        <div class="app-nav__group">
            <div class="app-nav__label">{{ group.label }}</div>
            {% for item in group['items'] %}
            <a class="app-nav__link{% if item.active %} is-active{% endif %}" href="{{ url_for(item.endpoint) }}"{% if item.active %} aria-current="page"{% endif %}>
                <i class="bi {{ item.icon }}" aria-hidden="true"></i>
                <span>{{ item.label }}</span>
            </a>
            {% endfor %}
        </div>
        {% endfor %}
    </nav>
    <div class="app-sidebar__user">
        <span class="app-sidebar__avatar" aria-hidden="true">{{ current_user.name[:1] }}</span>
        <div class="app-sidebar__identity"><strong>{{ current_user.name }}</strong><span>{{ current_user.role }}</span></div>
    </div>
</aside>
