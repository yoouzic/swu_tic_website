{% macro empty_state(title, description, action_label='', action_href='', compact=false) %}
<div class="empty-state{% if compact %} empty-state--compact{% endif %}"><i class="bi bi-inbox" aria-hidden="true"></i><h2>{{ title }}</h2><p>{{ description }}</p>{% if action_label %}<a class="btn btn-primary" href="{{ action_href }}">{{ action_label }}</a>{% endif %}</div>
{% endmacro %}
