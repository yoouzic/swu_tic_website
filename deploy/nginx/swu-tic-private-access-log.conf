# Use this format for the SWU TIC vhost access log.
map $uri $swu_tic_log_request {
    default $request;
    ~^/user/api/(?:listening-assistant|site-capture)(?:/|$) "$request_method $uri $server_protocol";
    ~^/admin/(?:api/(?:review|automation|export|forms/(?:export|import/export))|review/form|form|export_forms|export_statistics)(?:/|$) "$request_method $uri $server_protocol";
    ~^/admin/download_passwords(?:/|$) "$request_method /admin/download_passwords $server_protocol";
}

map $http_referer $swu_tic_log_referer {
    default $http_referer;
    ~^https?://[^/]+/user/api/(?:listening-assistant|site-capture)(?:/|[?]|$) "-";
    ~^https?://[^/]+/admin/(?:api/(?:review|automation|export|forms/(?:export|import/export))|review/form|form|export_forms|export_statistics|download_passwords)(?:/|[?]|$) "-";
}

log_format swu_tic_private '$remote_addr - $remote_user [$time_local] '
    '"$swu_tic_log_request" $status $body_bytes_sent '
    '"$swu_tic_log_referer" "$http_user_agent"';
